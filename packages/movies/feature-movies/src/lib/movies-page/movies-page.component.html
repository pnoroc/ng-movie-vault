<mv-search-autocomplete (search)="searchMovies($event)" />

<div class="title-row">
  <h1>Popular Movies</h1>
  <span>{{movies()?.length}} movies</span>
</div>

<mv-movies-list [movies]="movies()" (cardClick)="showMovieDetails($event)" />

<div class="more gap-4">
  <button class="btn-outline" type="button" (click)="showMoreMovies()">More</button>
</div>
