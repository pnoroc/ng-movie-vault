<mv-search-autocomplete (search)="searchMovies($event)" />

<div class="title-row">
  <h1>Popular Movies</h1>
  <span>Page {{moviesService.page()}} · {{movies()?.length}} movies</span>
</div>

<mv-movies-list [movies]="movies()" />

<div class="more gap-4">
  @if (moviesService.page() > 1) {
    <button class="btn-outline" type="button" (click)="previousPage()">Prev</button>
  }

  <button class="btn-outline" type="button" (click)="nextPage()">Next</button>
</div>
