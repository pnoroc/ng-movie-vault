@if (movie()) {
  <section
    class="flex cursor-pointer flex-col overflow-hidden rounded-xl border border-line bg-card transition duration-150 hover:-translate-y-1 hover:border-outline"
    (click)="cardClick.emit()"
  >
    <mv-movie-poster [movie]="movie()"/>

    <div class="flex flex-col gap-1 px-3 pt-2.5 pb-3 md:gap-1.5 md:px-4 md:pt-3.5 md:pb-4.5">
      <div class="text-sm leading-[1.3] font-bold md:text-base">{{ movie().title }}</div>
      <div class="text-xs text-muted">{{ movie().release_date | date: 'yyyy' }} · {{genreNames()}}</div>
      <div class="line-clamp-2 text-xs text-soft md:line-clamp-3 md:text-[13px]">{{ movie().overview }}</div>
    </div>
  </section>
}
