@if (movie()) {
  <section class="card" (click)="cardClick.emit()">
    <mv-movie-poster [movie]="movie()"/>

    <div class="card-body">
      <div class="card-title">{{ movie().title }}</div>
      <div class="card-meta">{{ movie().release_date | date: 'yyyy' }} · {{genreNames()}}</div>
      <div class="card-text">{{ movie().overview }}</div>
    </div>
  </section>
}
