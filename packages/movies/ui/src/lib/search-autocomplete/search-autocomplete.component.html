<section class="search">
  <div class="field">
    <label for="q">Search Movie</label>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9aa1b0" stroke-width="2"
         stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="M20 20l-3.5-3.5"/>
    </svg>
    <input
      #searchInp
      id="q"
      placeholder="Example, «The Terminator»"
      (keydown.enter)="searchQuery(searchInp.value)"
    />
  </div>
  <button class="btn" (click)="searchQuery(searchInp.value)">Search</button>
</section>
