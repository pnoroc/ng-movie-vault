<section class="search">
  <div class="field">
    <label for="q">Search Movie</label>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9aa1b0" stroke-width="2"
         stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="M20 20l-3.5-3.5"/>
    </svg>
    <input
      #searchInp
      id="q"
      type="search"
      autocomplete="off"
      placeholder="Example, «The Terminator»"
      [value]="query()"
      (input)="onInput(searchInp.value)"
      (keydown.enter)="submit(searchInp.value)"
    />
  </div>
  <button class="btn" type="button" (click)="submit(searchInp.value)">Search</button>
</section>
